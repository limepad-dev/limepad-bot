name: Collect creator fees

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run collect
        run: node scripts/collect-cron.mjs
        env:
          RH_RPC: ${{ secrets.RH_RPC }}
          CRON_PRIVATE_KEY: ${{ secrets.CRON_PRIVATE_KEY }}
